<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Yota - Menu Principal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6600;
      --orange-hover: #FF7A1A;
      --orange-dim: rgba(255,102,0,0.10);
      --black: #000000;
      --s1: #0D0D0D;
      --s2: #1A1A1A;
      --s3: #2A2A2A;
      --border: #222222;
      --t1: #FFFFFF;
      --t2: #A0A0A0;
      --t3: #555555;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--black);
      color: var(--t1);
      min-height: 100vh;
    }

    .header {
      background: var(--s1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      min-height: 60px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo img {
      height: 32px;
      width: auto;
    }

    .header-logo .titulo {
      font-size: 14px;
      font-weight: 700;
      color: var(--t1);
    }

    .btn-sair {
      background: var(--s2);
      color: var(--t1);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--r-sm);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sair:hover { background: var(--s3); }

    .content {
      padding: 30px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .welcome {
      text-align: center;
      margin-bottom: 40px;
    }

    .welcome h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--t2);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .menu-opcao {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px 20px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: var(--t1);
    }

    .menu-opcao:hover {
      border-color: var(--orange);
      background: var(--s2);
    }

    .menu-opcao:active {
      transform: scale(0.98);
    }

    .menu-icone {
      font-size: 36px;
      flex-shrink: 0;
      width: 60px;
      text-align: center;
    }

    .menu-texto { flex: 1; }

    .menu-titulo {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--t1);
    }

    .menu-desc {
      font-size: 13px;
      color: var(--t2);
      line-height: 1.4;
    }

    .menu-seta {
      color: var(--orange);
      font-size: 20px;
      font-weight: 700;
    }

    .disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .badge-soon {
      background: var(--orange-dim);
      color: var(--orange);
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--r-sm);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-left: 8px;
      vertical-align: middle;
    }

    .user-info {
      font-size: 11px;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 480px) {
      .header-logo img { height: 28px; }
      .header-logo .titulo { font-size: 13px; }
      .welcome h1 { font-size: 18px; }
      .menu-opcao { padding: 20px 16px; }
      .menu-icone { font-size: 32px; width: 50px; }
      .menu-titulo { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">
      <img src="logo.png" alt="Yota">
      <span class="titulo">Menu Principal</span>
    </div>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>

  <div class="content">
    <div class="welcome">
      <h1>⚡ Bem-vindo</h1>
      <p>O que você deseja fazer hoje?</p>
    </div>

    <a href="formulario.html" class="menu-opcao">
      <div class="menu-icone">🔨</div>
      <div class="menu-texto">
        <div class="menu-titulo">Finalizar Instalação</div>
        <div class="menu-desc">Enviar fotos e vídeo da obra concluída</div>
      </div>
      <div class="menu-seta">→</div>
    </a>

    <a href="retirada.html" class="menu-opcao">
      <div class="menu-icone">📦</div>
      <div class="menu-texto">
        <div class="menu-titulo">Retirar Material <span class="badge-soon">Novo</span></div>
        <div class="menu-desc">Registrar material retirado do estoque</div>
      </div>
      <div class="menu-seta">→</div>
    </a>

    <a href="devolucao.html" class="menu-opcao">
      <div class="menu-icone">📆</div>
      <div class="menu-texto">
        <div class="menu-titulo">Devolver Material <span class="badge-soon">Novo</span></div>
        <div class="menu-desc">Registrar devolução ao estoque</div>
      </div>
      <div class="menu-seta">→</div>
    </a>

    <div class="user-info" id="user-info"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ruhxqxcxtxqafmyczdai.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_krH18i5xMIJCOlB3pKpy0w_TU6H8nrg';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarLogin() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('user-info').textContent = 'Logado como: ' + session.user.email;
    }

    async function sair() {
      if (confirm('Deseja realmente sair do sistema?')) {
        await sb.auth.signOut();
        window.location.href = 'index.html';
      }
    }

    document.getElementById('btn-sair').addEventListener('click', sair);
    verificarLogin();
  </script>
</body>
</html>
